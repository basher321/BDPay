<!-- Spec 13: Bangla sign-in email. Shows the 6-digit code only - no link. Inline styles only (email clients). -->
<html lang="bn">
  <body style="margin:0;padding:24px;background:#080D1A;font-family:'Noto Sans Bengali',Arial,sans-serif;color:#F8FAFC;">
    <div style="max-width:420px;margin:0 auto;background:#17233D;border:1px solid #233558;border-radius:16px;padding:24px;">
      <p style="margin:0 0 4px;font-size:18px;font-weight:700;color:#00D09C;">BDPay</p>
      <p style="margin:0 0 16px;font-size:15px;">আপনার লগইন কোড:</p>
      <p style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:8px;color:#00D09C;">{{ .Token }}</p>
      <p style="margin:0 0 8px;font-size:13px;color:#B4C0D3;">কোডটি BDPay অ্যাপে লিখুন। কোডটি কাউকে জানাবেন না।</p>
      <p style="margin:0;font-size:13px;color:#8A9AB3;">আপনি লগইন করতে না চাইলে এই ইমেইলটি উপেক্ষা করুন।</p>
    </div>
  </body>
</html>
